<div id="cd-settings-modal" class="cd-modal cd-hidden">
  <div class="cd-modal-content">
    <div class="cd-card-header cd-space-between">
      <h2>Widget Preferences</h2>
      <button id="cd-close-modal" class="cd-btn cd-btn-secondary">&times;</button>
    </div>
    <div style="margin: 20px 0;">
      <label style="display: block; margin-bottom: 8px; font-weight: 700;">Theme Accent</label>
      <select id="cd-theme-select" style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--cd-card-border);">
        <option value="dark-neon">Dark Neon</option>
        <option value="cyber-amber">Cyber Amber</option>
        <option value="emerald-matrix">Emerald Matrix</option>
      </select>
    </div>
    <button id="cd-save-settings" class="cd-btn cd-btn-primary" style="width: 100%;">Apply Changes</button>
  </div>
</div>
